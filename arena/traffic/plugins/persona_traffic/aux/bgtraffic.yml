---
# Background-traffic lifecycle on the traffic hosts, driven by PersonaTraffic.
# `bgtraffic_action` selects the phase:
#   install  copy the stdlib daemon + vendored pyhuman + this host's persona, preflight it, install a
#            (stopped) systemd unit
#   start    start the unit and verify it stays active
#   stop     stop the unit
#   collect  fetch each host's labelled activity log back to the control node
#
# The daemon is STDLIB-ONLY: victim images have no pip mirror, so nothing is installed beyond copying
# files. python3 is assumed baked into the image.
- hosts: traffic_hosts
  gather_facts: false
  become: true
  vars:
    bgtraffic_dest: /opt/persona-traffic
    bgtraffic_log: /var/log/bgtraffic/activity.jsonl
    bgtraffic_user: ubuntu
    bgtraffic_allow_browser: false
    bgtraffic_allow_gui: false
    # Shared by the install-time --check and the running unit, so preflight and daemon agree.
    _bgtraffic_flags: "{{ '--allow-browser ' if bgtraffic_allow_browser else '' }}{{ '--allow-gui ' if bgtraffic_allow_gui else '' }}"

  tasks:
    # ---- install -------------------------------------------------------------
    - name: ensure install + log dirs exist
      when: bgtraffic_action == 'install'
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bgtraffic_dest }}"
        - "{{ bgtraffic_log | dirname }}"

    - name: make the activity log writable by the persona user
      when: bgtraffic_action == 'install'
      file:
        path: "{{ bgtraffic_log | dirname }}"
        owner: "{{ bgtraffic_user }}"

    - name: copy daemon package + vendored pyhuman
      when: bgtraffic_action == 'install'
      copy:
        src: "{{ item }}"
        dest: "{{ bgtraffic_dest }}/"
      loop:
        - "{{ bgtraffic_src }}/persona_traffic"
        - "{{ bgtraffic_src }}/vendor"

    - name: write this host's persona
      when: bgtraffic_action == 'install'
      copy:
        src: "{{ bgtraffic_persona_src }}"
        dest: "{{ bgtraffic_dest }}/persona.json"
        mode: "0644"

    - name: preflight persona + deps on this host
      when: bgtraffic_action == 'install'
      command:
        cmd: "python3 -m persona_traffic.daemon --persona {{ bgtraffic_dest }}/persona.json --check {{ _bgtraffic_flags }}"
        chdir: "{{ bgtraffic_dest }}"
      changed_when: false

    - name: install (stopped) systemd unit
      when: bgtraffic_action == 'install'
      copy:
        dest: /etc/systemd/system/bgtraffic.service
        mode: "0644"
        content: |
          [Unit]
          Description=Background traffic (persona-traffic) persona daemon
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ bgtraffic_dest }}
          Environment=PYTHONPATH={{ bgtraffic_dest }}
          ExecStart=/usr/bin/python3 -m persona_traffic.daemon --persona {{ bgtraffic_dest }}/persona.json --log {{ bgtraffic_log }} {{ _bgtraffic_flags }}
          Restart=on-failure
          User={{ bgtraffic_user }}

          [Install]
          WantedBy=multi-user.target

    - name: reload systemd (unit installed, not started)
      when: bgtraffic_action == 'install'
      systemd:
        daemon_reload: true

    # ---- start / stop --------------------------------------------------------
    - name: start background traffic
      when: bgtraffic_action == 'start'
      systemd:
        name: bgtraffic.service
        state: started

    - name: verify the daemon stayed up (catches runtime-only failures --check can't)
      when: bgtraffic_action == 'start'
      command: systemctl is-active bgtraffic.service
      register: _bg_active
      until: _bg_active.stdout == 'active'
      retries: 5
      delay: 2
      changed_when: false

    - name: stop background traffic
      when: bgtraffic_action == 'stop'
      systemd:
        name: bgtraffic.service
        state: stopped
      failed_when: false   # best-effort; a host already gone must not fail teardown

    # ---- collect -------------------------------------------------------------
    - name: fetch activity log to the control node
      when: bgtraffic_action == 'collect'
      fetch:
        src: "{{ bgtraffic_log }}"
        dest: "{{ bgtraffic_collect_dest }}/"
        flat: false
      failed_when: false   # a host with no log yet must not fail collection
