# Example arena config. Copy this to config.yaml and edit the paths + arena_host_ip:
#
#   cp example_config.yaml config.yaml
#
# The arena loads ./config.yaml by default. A second manager can point at a different
# file via the EXPERIMENT_MANAGER_CONFIG env var, so it can run a non-default backend
# without its startup clean-slate wiping the shared cloud.
#
# Only the three fields under "Required" must be set; every other field below is shown
# with its default (commented out = that default is used).

# ---- Required ----------------------------------------------------------------

# Local checkout of the Incalmo attacker repo (its .venv runs the C2 attacker).
incalmo_dir: /path/to/Incalmo

# Local checkout of MHBench — the environment backend that deploys the victim topology.
mhbench_dir: /path/to/MHBench

# The arena/manager host's own IP — the machine running the arena, as seen from the deployed
# environment. NOT the per-experiment bastion (that one is ephemeral, assigned at provisioning).
# Its one use: handed to the defender (as its config's management_ip) so the defender's
# self-protection never acts against the harness host. (The telemetry relay + fallback
# defender-box location is gcp_relay_ip, not this.)
arena_host_ip: 10.0.0.1

# ---- Python interpreters (default: each repo's own .venv/bin/python) ---------
# incalmo_python: /path/to/Incalmo/.venv/bin/python

# ---- Defenders (set only the one(s) you run; each fails fast if selected unset) ----
# deception_dir covers the llm_soc / deception / prompt_injection defenders.
# deception_dir:    /path/to/Defense-MHBench-compatible
# deception_python: /path/to/Defense-MHBench-compatible/.venv/bin/python
# velociraptor_dir: /path/to/velociraptor        # Velociraptor EDR; expects bin/velociraptor

# ---- Background traffic (optional third plugin class) ------------------------
# bgtraffic_dir: /path/to/caldera-human-traffic

# ---- Sliver attacker (optional) ----------------------------------------------
# Operator-client venv; defaults to <output_dir>/.sliver, built on first use.
# sliver_dir:    /path/to/sliver
# sliver_python: /path/to/sliver/.venv/bin/python

# ---- Output / state ----------------------------------------------------------
# output_dir:    output                     # per-experiment logs & results
# registry_path: experiment_registry.yaml   # live state of all experiments

# ---- MHBench environment-backend settings ------------------------------------
# NOTE: these describe how the MHBench ENVIRONMENT plugin deploys (which cloud, MHBench --config,
# mgmt-host IP) — they are not arena behavior. They live here only because the config is currently
# monolithic; properly they belong in the environment plugin's own config and should move there (the
# arena is meant to be backend-neutral). Only the environment plugin should read these.
os_cloud: openstack          # the clouds.yaml entry name to authenticate with
cloud_backend: openstack     # "openstack" (default) or "gcp"
# gcp routes MHBench through mhbench_config and skips the OpenStack clean-slate:
# mhbench_config: config/config.gcp.yaml     # passed to MHBench as --config (relative to mhbench_dir)
# gcp_relay_ip: 10.0.1.10                    # internal mgmt-host IP on the victim-reachable CIDR

# ---- Concurrency / admission -------------------------------------------------
# Defaults bound cluster network load (routers / FIPs / L3) that the vCPU tracker
# does not model. Loosen only if your fabric can take it.
max_concurrent_openstack_ops: 3    # concurrent provision + teardown (compute-heavy)
max_concurrent_configures: 5       # concurrent ansible configure (light)
max_concurrent_collects: 2         # concurrent post-run host-log collect
max_concurrent_attacker_setups: 2  # concurrent C2-attacker bring-up
max_active_experiments: 25         # hard cap on concurrently active experiments
max_deployed: 10                   # cap experiments in the deploy stage (back-pressure)
max_retries: 3
# max_active_vms: 100              # optional cap on total VMs across active experiments

# ---- GCP-only capacity (leave unset for OpenStack) ---------------------------
# On GCP the binding quota is the GLOBAL CPUS_ALL_REGIONS, which a VM count can't model.
# max_active_cpus: 80
# gcp_flavor_cpu_cost:
#   m1.small: 1     # -> e2-small
#   m2.large: 8     # -> e2-standard-8

# ---- Timeouts ----------------------------------------------------------------
# attacker_timeout_seconds: 2700        # real wall-clock cap on the attacker (scored TimedOut); unset = no cap
# experiment_timeout_seconds: 7200      # overall cap on the WHOLE run (provision -> ... -> teardown); unset = no cap.
#                                       # Safety backstop for a total hang: aborts + tears down (ExperimentTimedOut),
#                                       # distinct from attacker_timeout_seconds (which is a scored attacker cap).
defender_ready_timeout_seconds: 1800    # max time for a defender to finish arming
# ansible_verbosity: 0                  # 0-4 (-vvvv); also reads $ANSIBLE_VERBOSITY
