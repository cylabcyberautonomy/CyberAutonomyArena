[project]
name = "experiment-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-openstackclient>=6.0.0",
    "python-heatclient>=3.0.0",
]

[project.scripts]
serve = "uvicorn experiment_manager.main:app --reload"
