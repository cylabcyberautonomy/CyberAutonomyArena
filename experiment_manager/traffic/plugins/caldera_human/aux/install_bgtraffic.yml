---
# Background-traffic lifecycle on victim hosts, driven by CalderaHumanTraffic.
# One parametric play; `bgtraffic_action` selects the phase:
#   install  copy the stdlib daemon + vendored pyhuman + persona, validate it, install a
#            (stopped) systemd unit. Runs BEFORE pre-attack log rotation.
#   start    start the unit, so the benign activity lands in the attack-phase telemetry.
#   stop     stop the unit (attacker finished).
#   collect  fetch each host's labeled activity log back to the control node.
#
# The daemon is STDLIB-ONLY (see caldera-human-traffic): victim images have no pip
# mirror, so nothing is installed here beyond copying files. python3 is assumed baked.
- hosts: victims
  gather_facts: false
  become: true
  vars:
    bgtraffic_dest: /opt/caldera-human-traffic
    bgtraffic_log: /var/log/bgtraffic/activity.jsonl
    bgtraffic_user: ubuntu

  tasks:
    # ---- install -------------------------------------------------------------
    - name: ensure install + log dirs exist
      when: bgtraffic_action == 'install'
      file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ bgtraffic_dest }}"
        - "{{ bgtraffic_log | dirname }}"

    - name: copy daemon package + vendored pyhuman
      when: bgtraffic_action == 'install'
      copy:
        src: "{{ item }}"
        dest: "{{ bgtraffic_dest }}/"
      loop:
        - "{{ bgtraffic_src }}/caldera_human_traffic"
        - "{{ bgtraffic_src }}/vendor"

    - name: write persona (from a control-node file the plugin rendered)
      when: bgtraffic_action == 'install'
      copy:
        src: "{{ bgtraffic_persona_src }}"
        dest: "{{ bgtraffic_dest }}/persona.json"
        mode: "0644"

    - name: validate persona is runnable on this host (fails install if not)
      when: bgtraffic_action == 'install'
      command:
        cmd: "python3 -m caldera_human_traffic.daemon --persona {{ bgtraffic_dest }}/persona.json --check"
        chdir: "{{ bgtraffic_dest }}"
      changed_when: false

    - name: install (stopped) systemd unit
      when: bgtraffic_action == 'install'
      copy:
        dest: /etc/systemd/system/bgtraffic.service
        mode: "0644"
        content: |
          [Unit]
          Description=Background traffic (caldera-human-traffic) persona daemon
          After=network.target

          [Service]
          Type=simple
          WorkingDirectory={{ bgtraffic_dest }}
          Environment=PYTHONPATH={{ bgtraffic_dest }}
          ExecStart=/usr/bin/python3 -m caldera_human_traffic.daemon --persona {{ bgtraffic_dest }}/persona.json --log {{ bgtraffic_log }}
          Restart=on-failure
          User={{ bgtraffic_user }}

          [Install]
          WantedBy=multi-user.target

    - name: reload systemd (unit installed, NOT started — start is a separate phase)
      when: bgtraffic_action == 'install'
      systemd:
        daemon_reload: true

    # ---- start / stop --------------------------------------------------------
    - name: start background traffic
      when: bgtraffic_action == 'start'
      systemd:
        name: bgtraffic.service
        state: started

    - name: stop background traffic
      when: bgtraffic_action == 'stop'
      systemd:
        name: bgtraffic.service
        state: stopped
      failed_when: false   # best-effort; a host already gone must not fail teardown

    # ---- collect -------------------------------------------------------------
    - name: fetch activity log to the control node
      when: bgtraffic_action == 'collect'
      fetch:
        src: "{{ bgtraffic_log }}"
        dest: "{{ bgtraffic_collect_dest }}/"
        flat: false
      failed_when: false   # a host with no log yet must not fail collection
