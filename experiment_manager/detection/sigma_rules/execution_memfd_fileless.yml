title: Anonymous In-Memory File Creation (memfd_create)
id: 40fb08d1-826e-4ab1-8eef-aa81cedb6a9e
status: experimental
description: >
    Detects memfd_create, which allocates an anonymous in-memory file. Combined with fexecve it
    lets a binary run entirely from memory without ever touching disk — a common fileless /
    reflective-loading evasion. Rarely used by benign software.
references:
    - https://attack.mitre.org/techniques/T1620/
author: MHBench detection harness
date: 2026/09/01
logsource:
    product: linux
    service: auditd
detection:
    selection:
        key: anon_file_create
    # systemd uses memfd_create for its own service execution (sd-executor) — exclude it. A shell,
    # interpreter, or attacker binary calling memfd_create is the fileless-execution signal.
    filter_benign:
        exe|endswith:
            - /systemd
    condition: selection and not filter_benign
falsepositives:
    - A few language runtimes/loaders use memfd_create; baseline per image before alerting.
level: high
tags:
    - attack.defense-evasion
    - attack.execution
    - attack.t1620
