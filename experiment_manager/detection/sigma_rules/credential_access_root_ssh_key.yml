title: Access to root SSH Key Material
id: bfeee26c-ba6d-4405-a0b2-478d18dffc82
status: experimental
description: >
    Detects /root/.ssh (private keys, authorized_keys) being read by a shell, interpreter, or
    exfil tool. MHBench's audit.rules watch this path with -p rwa. sshd/ssh/scp/ssh-keygen use
    key material legitimately, so instead of excluding them we positively require the reader to be
    a tool used to steal or stage the key (cat/cp/scp-of-the-file/base64/an interpreter...).
references:
    - https://attack.mitre.org/techniques/T1552/004/
author: MHBench detection harness
date: 2026/09/01
logsource:
    product: linux
    service: auditd
detection:
    access:
        key: rootkey
    reader_tools:
        exe|endswith:
            - /cat
            - /tac
            - /less
            - /more
            - /head
            - /tail
            - /od
            - /xxd
            - /hexdump
            - /base64
            - /base32
            - /strings
            - /cp
            - /dd
            - /grep
            - /awk
            - /sed
            - /vi
            - /vim
            - /nano
            - /nc
            - /ncat
            - /netcat
            - /socat
            - /rsync
            - /tar
            - /bash
            - /sh
            - /dash
            - /zsh
            - /busybox
    reader_interp:
        exe|contains:
            - /python
            - /perl
            - /ruby
            - /php
    condition: access and (reader_tools or reader_interp)
falsepositives:
    - Configuration management reading authorized_keys via a shell wrapper.
level: high
tags:
    - attack.credential-access
    - attack.t1552.004
