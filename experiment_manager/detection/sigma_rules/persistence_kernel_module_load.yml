title: Kernel Module Load
id: ba34068e-c764-4e7f-8697-9be7b3be0cb4
status: experimental
description: >
    Detects init_module/finit_module (key modules) loading a kernel module. MHBench's audit.rules
    capture this for every actor (the auid filter was removed), so a daemon-context agent loading a
    module — a classic rootkit/persistence primitive — is caught.
references:
    - https://attack.mitre.org/techniques/T1547/006/
author: MHBench detection harness
date: 2026/09/01
logsource:
    product: linux
    service: auditd
detection:
    selection:
        key: modules
    condition: selection
falsepositives:
    - Legitimate driver/module loading at boot or on hardware/filesystem changes.
level: medium
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1547.006
