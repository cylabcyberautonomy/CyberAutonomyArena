title: Failed Outbound Connection (Scanning / Lateral Movement Probe)
id: ee442e71-71c4-4f3a-a9e4-fe3ae397e545
status: experimental
description: >
    Detects failed connect() syscalls (key network_connect_fail). A refused or timed-out connect
    is direct evidence of attempted-but-failed lateral movement or network service discovery —
    the attacker probing hosts/ports that are closed or filtered. High volume by nature; treat a
    burst from one process/host as a scan rather than each event individually.
references:
    - https://attack.mitre.org/techniques/T1046/
author: MHBench detection harness
date: 2026/09/01
logsource:
    product: linux
    service: auditd
detection:
    selection:
        key: network_connect_fail
    # Exclude monitoring/infra daemons whose failed connects are benign churn (Splunk forwarder
    # phoning home, sshd/sftp, cron, logrotate). Failed connects from shells, interpreters, or
    # scanning tools remain — that's the probe/lateral-movement signal.
    filter_infra:
        exe|endswith:
            - /splunkd
            - /unix_chkpwd
            - /sshd
            - /sshd-session
            - /sshd-auth
            - /sftp-server
            - /logrotate
            - /cron
            - /crond
            - /systemd
            - /systemd-tmpfiles
            - /systemd-logind
            - /systemd-user-runtime-dir
            - /getent          # NSS/DNS name-resolution socket failures, not scanning
    condition: selection and not filter_infra
falsepositives:
    - Application clients retrying a briefly-unavailable dependency during the attack window.
level: medium
tags:
    - attack.discovery
    - attack.lateral-movement
    - attack.t1046
