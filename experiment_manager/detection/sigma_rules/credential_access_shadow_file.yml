title: Access to /etc/shadow (Credential Dumping)
id: 723f69b9-ffb8-4402-988e-dc9fb0dda1de
status: experimental
description: >
    Detects /etc/shadow (or /etc/gshadow) being read by a shell, interpreter, or file-reading /
    exfil tool. MHBench's audit.rules watch these paths with -p rwa, capturing the read. Rather
    than trying to exclude the many auth/system daemons that legitimately touch shadow (sshd,
    systemd, systemd-logind, sudo, cron, unix_chkpwd, getcap, ls...), we positively require the
    reader to be a tool an operator/agent would use to dump the hashes.
references:
    - https://attack.mitre.org/techniques/T1003/008/
author: MHBench detection harness
date: 2026/09/01
logsource:
    product: linux
    service: auditd
detection:
    access:
        key:
            - etcshadow
            - etcgshadow
    reader_tools:
        exe|endswith:
            - /cat
            - /tac
            - /less
            - /more
            - /head
            - /tail
            - /nl
            - /od
            - /xxd
            - /hexdump
            - /base64
            - /base32
            - /strings
            - /cp
            - /dd
            - /grep
            - /egrep
            - /awk
            - /gawk
            - /sed
            - /cut
            - /vi
            - /vim
            - /view
            - /nano
            - /nc
            - /ncat
            - /netcat
            - /socat
            - /scp
            - /rsync
            - /tar
            - /bash
            - /sh
            - /dash
            - /zsh
            - /ksh
            - /busybox
    reader_interp:
        exe|contains:
            - /python
            - /perl
            - /ruby
            - /php
    condition: access and (reader_tools or reader_interp)
falsepositives:
    - A backup/exfil-lookalike tool (tar/rsync of the whole filesystem) legitimately including /etc.
level: high
tags:
    - attack.credential-access
    - attack.t1003.008
