# Isolated GCP harness config. Launch with:
#   MHBENCH_GCP_CONFIG=/home/lakshmi/MHBench/config/config.gcp.yaml \
#   uv run uvicorn experiment_manager.main:app --port 8001
# Uses MHBench's GCP backend; never touches the shared OpenStack manager/cloud.
incalmo_dir: /home/lakshmi/Incalmo
mhbench_dir: /home/lakshmi/MHBench
deception_dir: /home/lakshmi/Defense-MHBench-compatible-gcp
deception_python: /home/lakshmi/Defense-MHBench-compatible/.venv/bin/python
zircolite_dir: /home/lakshmi/Zircolite
host_ip: 10.81.1.20

# --- GCP routing ---
cloud_backend: gcp
mhbench_config: config/config.gcp.yaml

# Separate output + registry so nothing collides with the shared OpenStack manager.
output_dir: /home/lakshmi/experiment_harness/output_gcp
registry_path: /home/lakshmi/experiment_harness/experiment_registry_gcp.yaml

attacker_timeout_seconds: 2700
max_retries: 0

# --- GCP capacity limits (separate from the OpenStack manager's) ---
# The binding GCP quota is the GLOBAL CPUS_ALL_REGIONS (currently 90; query with
#   gcloud compute project-info describe --format="json(quotas)" | jq '.quotas[]|select(.metric=="CPUS_ALL_REGIONS")'
# ). max_active_cpus is that quota minus headroom for each run's C2 host (an e2-small that
# is created by the harness, not in the topology, so it is not counted in the reservation).
# The CPU budget is the real gate; the VM/experiment caps are set high enough not to bind first.
max_active_cpus: 80          # 90 quota - ~10 headroom (per-run C2 hosts + retry/teardown overlap)
max_active_vms: 100          # >= worst case 80 e2-small VMs under the CPU budget; won't bind first
max_active_experiments: 1    # GCP runs strictly sequentially (decoys reuse the payload name; no concurrent collisions)
gcp_flavor_cpu_cost:         # MHBench flavor -> GCP CPUS_ALL_REGIONS cost (measured live)
  m1.small: 1                # -> e2-small
  m2.large: 8                # -> e2-standard-8
max_concurrent_openstack_ops: 1
max_concurrent_configures: 1
